server {
    server_name http.cat;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    # `listen ... http2` is deprecated since Nginx 1.25.1
    http2 on;

    access_log /var/log/nginx/http.cat.access.log;
    error_log /var/log/nginx/http.cat.error.log;

    ssl_certificate /etc/letsencrypt/live/http.cat/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/http.cat/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /home/rogeriopvl/www/http.cat;

    index index.html;

    expires $httpcat_expires;

    # every 404 on the site is the 404 cat. Kept at server level so every
    # location inherits it, except the image and JSON locations, which set
    # their own (specs 0003 and 0008).
    error_page 404 /images/404.jpg;

    location / {
        # strip trailing slashes (e.g. /status/419/ -> /status/419)
        rewrite ^/(.+)/$ /$1 permanent;

        # Order matters: `$uri.html` must come before any directory check,
        # because Next.js 16 exports a directory next to each page's .html file
        # (e.g. status/419/ next to status/419.html). See issue #267.
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /random {
        absolute_redirect off;
        expires off;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
        return 302 /$httpcat_random_code;
    }

    # the image API: /404 and /404.jpg serve images/404.jpg, whatever the build
    # output contains. See specs/0001-image-routing.
    #
    # Other sites can read the images (canvas, fetch, <img crossorigin>), see
    # specs/0008-image-cors. Unknown codes (/999) get the 404 cat from this
    # location rather than the server-level error_page, which `location /`
    # serves without the header.
    location ~ ^/(\d+)(\.jpg)?$ {
        add_header Access-Control-Allow-Origin * always;
        error_page 404 /404.jpg;
        try_files /images/$1.jpg =404;
    }

    # the JSON API: /500.json returns the status information. See
    # specs/0003-json-responses.
    location ~ ^/\d+\.json$ {
        add_header Access-Control-Allow-Origin * always;
        error_page 404 /404.json;
        try_files $uri =404;
    }

    # easter egg: /dog -> 400 Bad Request cat
    location ~ ^/dog(\.jpg)?$ {
        return 302 /400$1;
    }
}
