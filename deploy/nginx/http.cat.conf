# Nginx config for https://http.cat — this file is the source of truth for the
# production server config.
#
# The site is a static Next.js export (`out/`), and the "API" (e.g. /404 returning
# the cat image) is implemented here. See specs/0000-baseline/spec.md for the
# expected behavior of every URL.
#
# To apply changes on the server:
#   1. Copy this file to the server's nginx sites config
#   2. Run `sudo nginx -t && sudo systemctl reload nginx`
#   3. Purge the Cloudflare cache, or cached responses will hide the change

server {
    listen 80;
    listen [::]:80;
    server_name http.cat;
    return 301 https://$server_name$request_uri;
}

# Expires map
# https://www.digitalocean.com/community/tutorials/how-to-implement-browser-caching-with-nginx-s-header-module-on-ubuntu-16-04
#
# Nginx variables are shared by every site on the server, and a map for a
# variable another site's config also maps silently replaces it (whichever
# loads last wins, and `nginx -t` doesn't complain). So the variable is named
# after this site: as plain $expires, another site's older map without the
# font line took over and fonts weren't cached. Don't start it with http_:
# that prefix is for request headers.
map $sent_http_content_type $httpcat_expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    ~image/                    max;
    # the site's font (Literata, served by Next with a hash in its name, like
    # the CSS and JS)
    ~font/                     max;
}

# Nginx generates a fresh $request_id for each request, even on a reused
# connection. Regenerate the buckets with npm run nginx:update-random.
split_clients $request_id $httpcat_random_code {
    1.28%   100;
    1.28%   101;
    1.28%   102;
    1.28%   103;
    1.29%   200;
    1.28%   201;
    1.28%   202;
    1.28%   203;
    1.28%   204;
