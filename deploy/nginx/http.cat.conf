# Nginx config for https://http.cat — this file is the source of truth for the
# production server config.
#
# The site is a static Next.js export (`out/`), and the "API" (e.g. /404 returning
# the cat image) is implemented here. See specs/0000-baseline/spec.md for the
# expected behavior of every URL.
#
# To apply changes on the server:
#   1. Copy this file to the server's nginx sites config
#   2. Run `sudo nginx -t && sudo systemctl reload nginx`
#   3. Purge the Cloudflare cache, or cached responses will hide the change

server {
    listen 80;
    listen [::]:80;
    server_name http.cat;
    return 301 https://$server_name$request_uri;
}

# Expires map
# https://www.digitalocean.com/community/tutorials/how-to-implement-browser-caching-with-nginx-s-header-module-on-ubuntu-16-04
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    ~image/                    max;
}

server {
    server_name http.cat;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    # `listen ... http2` is deprecated since Nginx 1.25.1
    http2 on;

    access_log /var/log/nginx/http.cat.access.log;
    error_log /var/log/nginx/http.cat.error.log;

    ssl_certificate /etc/letsencrypt/live/http.cat/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/http.cat/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /home/rogeriopvl/www/http.cat;

    index index.html;

    expires $expires;

    # every 404 on the site is the 404 cat. Kept at server level so the regex
    # locations below inherit it too.
    error_page 404 /images/404.jpg;

    location / {
        # strip trailing slashes (e.g. /status/419/ -> /status/419)
        rewrite ^/(.+)/$ /$1 permanent;

        # Order matters: `$uri.html` must come before any directory check,
        # because Next.js 16 exports a directory next to each page's .html file
        # (e.g. status/419/ next to status/419.html). See issue #267.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # the image API: /404 and /404.jpg serve images/404.jpg, whatever the build
    # output contains. See specs/0001-image-routing.
    location ~ ^/(\d+)(\.jpg)?$ {
        try_files /images/$1.jpg =404;
    }

    # the JSON API: /500.json returns the status information. See
    # specs/0003-json-responses.
    location ~ ^/\d+\.json$ {
        add_header Access-Control-Allow-Origin * always;
        error_page 404 /404.json;
        try_files $uri =404;
    }

    # easter egg: /dog -> 400 Bad Request cat
    location ~ ^/dog(\.jpg)?$ {
        return 302 /400$1;
    }
}
