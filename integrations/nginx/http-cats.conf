# HTTP Cats error pages for Nginx — https://http.cat
#
# Replaces the body of Nginx error responses with the matching HTTP Cat image,
# while keeping the original status code.
#
# Usage:
#   1. Save this file as /etc/nginx/snippets/http-cats.conf
#   2. Add `include snippets/http-cats.conf;` to the server block(s) where you
#      want the cats
#   3. Run `sudo nginx -t && sudo systemctl reload nginx`
#
# Based on https://gist.github.com/mjmeyer/6cf8d3c1199d028f0921 by @mjmeyer.

# a resolver is required because proxy_pass below uses a variable
resolver 1.1.1.1;

error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 419 420 421 422 423 424 425 426 428 429 431 450 451 495 496 497 498 500 501 502 503 504 506 507 508 509 510 511 521 522 523 525 530 599 /http-cat-error;

location = /http-cat-error {
    internal;
    proxy_pass https://http.cat/$status;
    proxy_ssl_server_name on;

    # don't let browsers cache error pages with http.cat's long image cache headers
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
}
